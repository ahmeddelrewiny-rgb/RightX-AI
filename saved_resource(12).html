<!DOCTYPE html>
<!-- saved from url=(0040)https://web-sandbox.oaiusercontent.com/? -->
<html lang="ar" dir="rtl"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RightX AI</title>
<link rel="stylesheet" href="./all.min.css">
<style>
  body { margin:0; font-family: Arial, sans-serif; background:#fff; color:#000; }
  header { display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#f5f5f5; }
  header h1 { margin:0; color:#000; }
  nav { display:flex; gap:20px; }
  nav button { padding:10px 20px; border:none; background:#e0e0e0; cursor:pointer; border-radius:5px; }
  nav button.active { background:#000; color:#fff; }
  main { padding:20px; margin-left:220px; }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
  textarea, input, select { width:100%; padding:10px; margin:10px 0; border-radius:5px; border:1px solid #ccc; }
  button.action-btn { padding:10px 20px; border:none; background:#000; color:#fff; border-radius:5px; cursor:pointer; }
  #your-chats { position:fixed; left:0; top:60px; width:200px; height:calc(100% - 60px); background:#f0f0f0; overflow-y:auto; padding:10px; }
  #your-chats h3 { margin-top:0; }
  #your-chats div { padding:5px; border-bottom:1px solid #ccc; cursor:pointer; }
  img, video { max-width:100%; margin:10px 0; border-radius:5px; }
</style>
<style>html,body,#root{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;margin:0;padding:0}html,body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Oxygen,Ubuntu,Cantarell,Helvetica Neue,Arial,sans-serif!important}button,input,textarea,select{font-family:inherit}html{background-color:#fff}html.dark{background-color:#212121}html.mobileSkybridge.dark{background-color:#000}@supports (font: -apple-system-body){html.mobileSkybridge{font:-apple-system-body}}html.desktopSkybridge.dark{background-color:#1e1e1e}</style></head>
<body>

<header>
  <h1>RightX AI</h1>
  <nav>
    <button class="tab-btn" data-tab="qa">الأسئلة</button>
    <button class="tab-btn active" data-tab="images">توليد الصور</button>
    <button class="tab-btn" data-tab="videos">توليد الفيديو</button>
  </nav>
</header>

<div id="your-chats">
  <h3>Your Chats</h3>
</div>

<main>
  <!-- الأسئلة -->
  <div class="tab-content" id="qa">
    <textarea id="question" placeholder="اكتب سؤالك هنا..."></textarea>
    <button class="action-btn" onclick="askQuestion()">اسأل AI</button>
    <div id="answer"></div>
  </div>

  <!-- الصور -->
  <div class="tab-content active" id="images">
    <textarea id="image-prompt" placeholder="اكتب وصف الصورة هنا..."></textarea>
    <select id="image-size">
      <option value="1:1">1:1</option>
      <option value="16:9">16:9</option>
      <option value="9:16">9:16</option>
    </select>
    <button class="action-btn" onclick="generateImage()">توليد الصورة</button>
    <div id="image-result"></div>
  </div>

  <!-- الفيديو -->
  <div class="tab-content" id="videos">
    <textarea id="video-prompt" placeholder="اكتب وصف الفيديو هنا..."></textarea>
    <select id="video-duration">
      <option value="1">1 ثانية</option>
      <option value="5">5 ثواني</option>
      <option value="10">10 ثواني</option>
      <option value="30">30 ثانية</option>
      <option value="60">1 دقيقة</option>
    </select>
    <button class="action-btn" onclick="generateVideo()">توليد الفيديو</button>
    <div id="video-result"></div>
  </div>
</main>

<script>
const API_KEY = "AIzaSyBcK3_VIWllM5VCw-N0msZ4jMKs3HxoCVI"; // ضع مفتاحك هنا

// Tabs
const tabs = document.querySelectorAll('.tab-btn');
const contents = document.querySelectorAll('.tab-content');
tabs.forEach(btn => btn.addEventListener('click', () => {
  tabs.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const target = btn.getAttribute('data-tab');
  contents.forEach(c => c.classList.remove('active'));
  document.getElementById(target).classList.add('active');
}));

// حفظ المحادثات
function saveChat(type, prompt, result) {
  const container = document.getElementById('your-chats');
  const div = document.createElement('div');
  div.textContent = `${type}: ${prompt} → ${result.substring(0, 30)}...`;
  container.appendChild(div);
}

// دوال AI
async function askQuestion() {
  const question = document.getElementById('question').value;
  const response = await fetch('https://api.openai.com/v1/chat/completions', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':`Bearer ${API_KEY}`
    },
    body: JSON.stringify({
      model: "gpt-4",
      messages:[{role:"user", content:question}],
      max_tokens: 500
    })
  });
  const data = await response.json();
  const answer = data.choices[0].message.content;
  document.getElementById('answer').innerText = answer;
  saveChat('سؤال', question, answer);
}

async function generateImage() {
  const prompt = document.getElementById('image-prompt').value;
  const size = document.getElementById('image-size').value;
  const response = await fetch('https://api.openai.com/v1/images/generations', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':`Bearer ${API_KEY}`
    },
    body: JSON.stringify({
      prompt: prompt,
      n: 1,
      size: size
    })
  });
  const data = await response.json();
  const imgUrl = data.data[0].url;
  document.getElementById('image-result').innerHTML = `<img src="${imgUrl}"/>`;
  saveChat('صورة', prompt, imgUrl);
}

async function generateVideo() {
  const prompt = document.getElementById('video-prompt').value;
  const duration = document.getElementById('video-duration').value;
  const response = await fetch('https://api.openai.com/v1/videos/generations', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':`Bearer ${API_KEY}`
    },
    body: JSON.stringify({
      prompt: prompt,
      duration: duration
    })
  });
  const data = await response.json();
  const videoUrl = data.data[0].url;
  document.getElementById('video-result').innerHTML = `<video src="${videoUrl}" controls></video>`;
  saveChat('فيديو', prompt, videoUrl);
}
</script>


</body></html>
