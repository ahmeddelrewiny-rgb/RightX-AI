<textarea id="prompt" placeholder="Describe your image or video..." class="w-full p-3 bg-slate-700 rounded mb-3"></textarea>

<!-- OPTIONS -->
<div class="flex gap-2 mb-4">
  <select id="nanoType" class="bg-slate-700 p-2 rounded">
    <option value="normal">Nano Banana (Unlimited)</option>

  </select>
  <select id="imgSize" class="bg-slate-700 p-2 rounded">
    <option value="512">512x512</option>
    <option value="1024">1024x1024</option>
    <option value="2048">2048x2048</option>
  </select>
  <select id="videoSize" class="bg-slate-700 p-2 rounded">
    <option value="720">720p</option>
    <option value="1080">1080p</option>
    <option value="2160">4K</option>
  </select>
</div>

<div class="flex gap-2 justify-center mb-4">
  <button onclick="generateImage()" class="bg-blue-600 px-4 py-2 rounded">Generate Image</button>
  <button onclick="generateVideo()" class="bg-purple-600 px-4 py-2 rounded">Generate Video</button>
</div>

<!-- UPLOAD IMAGE -->
<input type="file" accept="image/*" onchange="loadImage(event)" class="mb-3">

<canvas id="canvas" width="512" height="512"></canvas>

<div class="flex gap-2 mt-3 justify-center">
  <button onclick="clearCanvas()" class="bg-gray-600 px-3 py-1 rounded">Clear</button>
  <button onclick="downloadImage()" class="bg-green-600 px-3 py-1 rounded">Download</button>
</div>

<div id="result" class="mt-4 text-center"></div>

<script type="module">
import { auth, db, storage } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
const apiKey = "PUT_YOUR_AI_API_KEY_HERE";
let currentUser = null;
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let dailyData = { images:0, videos:0, lastReset:0 };

// ===== AUTH =====
window.register = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  if(!email||!password)return alert("Fill all fields");
  try{
    const userCredential = await firebase.auth().createUserWithEmailAndPassword(auth,email,password);
    alert("Registered! Login now");
  }catch(e){alert(e.message);}
}
window.login = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try{
    const userCredential = await firebase.auth().signInWithEmailAndPassword(auth,email,password);
    currentUser = userCredential.user;
    document.getElementById("status").innerText = "Logged in: "+currentUser.email;
    await loadDailyData();
  }catch(e){alert(e.message);}
}
window.logout = async function(){
  await firebase.auth().signOut(auth);
  currentUser=null;
  document.getElementById("status").innerText="Logged out";
}

// ===== DAILY DATA =====
async function loadDailyData(){
  const docRef = doc(db,"users",currentUser.uid);
  const docSnap = await getDoc(docRef);
  const today = new Date().setHours(0,0,0,0);
  if(docSnap.exists()){
    dailyData = docSnap.data();
    if(dailyData.lastReset<today){
      dailyData.images=0; dailyData.videos=0; dailyData.lastReset=today;
      await setDoc(docRef,dailyData);
    }
  } else {
    dailyData = { images:0, videos:0, lastReset:today };
    await setDoc(docRef,dailyData);
  }
}

// ===== DRAW =====
let drawing=false;
canvas.onmousedown=()=>drawing=true;
canvas.onmouseup=()=>drawing=false;
canvas.onmousemove=(e)=>{if(!drawing)return;ctx.fillStyle="white";ctx.fillRect(e.offsetX,e.offsetY,4,4);};
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);}
function loadImage(e){const file=e.target.files[0];const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,512,512);img.src=URL.createObjectURL(file);}
function downloadImage(){const a=document.createElement("a");a.href=canvas.toDataURL();a.download="image.png";a.click();}

// ===== GENERATE IMAGE =====
async function generateImage(){
  if(!currentUser){alert("Login first"); return;}
  const prompt = document.getElementById("prompt").value;
  const type = document.getElementById("nanoType").value;
  const size = document.getElementById("imgSize").value;
  
  // Check limits
  if(type==="pro" && dailyData.images>=4){alert("Nano Banana Pro daily limit reached"); return;}
  
  result.innerHTML="<div class='loader'></div>";
  
  const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({
      contents:[{parts:[{text:prompt}]}],
      generationConfig:{responseModalities:["IMAGE"],imageConfig:{size:size}}
    })
  });
  const data = await res.json();
  const base64=data.candidates?.[0]?.content?.parts?.find(p=>p.inlineData)?.inlineData?.data;
  if(base64){
    const img=new Image();
    img.onload=()=>ctx.drawImage(img,0,0,512,512);
    img.src="data:image/png;base64,"+base64;
    result.innerHTML="✅ Image Ready";
    dailyData.images++;
    await setDoc(doc(db,"users",currentUser.uid),dailyData,{merge:true});
  } else result.innerHTML="❌ Error";
}

// ===== GENERATE VIDEO =====
async function generateVideo(){
  if(!currentUser){alert("Login first"); return;}
  const prompt = document.getElementById("prompt").value;
  const type = document.getElementById("nanoType").value;
  const vSize = document.getElementById("videoSize").value;
  if(type==="pro" && dailyData.videos>=5){alert("Nano Banana Pro daily video limit reached"); return;}
  result.innerHTML="<div class='loader'></div>";
  
  let images=[];
  const totalScenes = 20; // start small, user يقدر يغير لعدد أكبر لمده الفيديو
  for(let i=0;i<totalScenes;i++){
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-image-preview:generateContent?key=${apiKey}`,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        contents:[{parts:[{text:prompt+" scene "+i}]}],
        generationConfig:{responseModalities:["IMAGE"],imageConfig:{size:512}}
      })
    });
    const data = await res.json();
    const base64=data.candidates?.[0]?.content?.parts?.find(p=>p.inlineData)?.inlineData?.data;
    if(base64) images.push("data:image/png;base64,"+base64);
  }
  
  createVideo(images);
  dailyData.videos++;
  await setDoc(doc(db,"users",currentUser.uid),dailyData,{merge:true});
}

// ===== CREATE VIDEO =====
function createVideo(images){
  const stream=canvas.captureStream(1);
  const recorder=new MediaRecorder(stream);
  let chunks=[];
  recorder.ondataavailable=e=>chunks.push(e.data);
  recorder.onstop=()=>{
    const blob=new Blob(chunks,{type:"video/mp4"});
    const url=URL.createObjectURL(blob);
    result.innerHTML=`<video controls src="${url}" class="mx-auto"></video>
    <br><a href="${url}" download="video.mp4" class="bg-green-600 px-3 py-1 rounded">Download Video</a>`;
  };
  recorder.start();
  let i=0;
  function draw(){
    if(i>=images.length){recorder.stop();return;}
    const img=new Image();
    img.src=images[i];
    img.onload=()=>{ctx.drawImage(img,0,0,512,512);i++;setTimeout(draw,1500);}
  }
  draw();
}
</script>
</div>
