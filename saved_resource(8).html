  </div>
  <p id="status" class="text-sm text-gray-700"></p>
</div>

<!-- PROMPT -->
<textarea id="prompt" placeholder="Describe your image or video..." class="w-full p-3 rounded mb-3 border-2 border-black"></textarea>

<!-- OPTIONS -->
<div class="flex gap-2 mb-4">
  <select id="nanoType" class="p-2 rounded border-2 border-black">
    <option value="normal">Nano Banana (Unlimited)</option>
    <option value="pro">Nano Banana Pro (4 images/day, 5 videos/day)</option>
  </select>
  <select id="imgSize" class="p-2 rounded border-2 border-black">
    <option value="512">512x512</option>
    <option value="1024">1024x1024</option>
    <option value="2048">2048x2048</option>
  </select>
  <select id="videoSize" class="p-2 rounded border-2 border-black">
    <option value="720">720p</option>
    <option value="1080">1080p</option>
    <option value="2160">4K</option>
  </select>
</div>

<!-- BUTTONS -->
<div class="flex gap-2 justify-center mb-4">
  <button onclick="generateImage()" class="px-4 py-2 rounded border-2 border-black">Generate Image</button>
  <button onclick="generateVideo()" class="px-4 py-2 rounded border-2 border-black">Generate Video</button>
</div>

<!-- UPLOAD IMAGE -->
<input type="file" accept="image/*" onchange="loadImage(event)" class="mb-3 border-2 border-black">

<!-- CANVAS -->
<canvas id="canvas" width="512" height="512"></canvas>

<div class="flex gap-2 mt-3 justify-center">
  <button onclick="clearCanvas()" class="px-3 py-1 rounded border-2 border-black">Clear</button>
  <button onclick="downloadImage()" class="px-3 py-1 rounded border-2 border-black">Download</button>
</div>

<div id="result" class="mt-4 text-center text-black"></div>

<script type="module">
import { auth, db, storage } from "https://www.gstatic.com/firebasejs/10.3.0/firebase-app.js";
const apiKey = "PUT_YOUR_AI_API_KEY_HERE";
let currentUser = null;
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
let dailyData = { images:0, videos:0, lastReset:0 };

// ===== AUTH FUNCTIONS =====
window.register = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  if(!email||!password)return alert("Fill all fields");
  try{
    const userCredential = await firebase.auth().createUserWithEmailAndPassword(auth,email,password);
    alert("Registered! Login now");
  }catch(e){alert(e.message);}
}
window.login = async function(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  try{
    const userCredential = await firebase.auth().signInWithEmailAndPassword(auth,email,password);
    currentUser = userCredential.user;
    document.getElementById("status").innerText = "Logged in: "+currentUser.email;
    await loadDailyData();
  }catch(e){alert(e.message);}
}
window.logout = async function(){
  await firebase.auth().signOut(auth);
  currentUser=null;
  document.getElementById("status").innerText="Logged out";
}

// ===== DRAW / IMAGE FUNCTIONS =====
let drawing=false;
canvas.onmousedown=()=>drawing=true;
canvas.onmouseup=()=>drawing=false;
canvas.onmousemove=(e)=>{if(!drawing)return;ctx.fillStyle="black";ctx.fillRect(e.offsetX,e.offsetY,4,4);};
function clearCanvas(){ctx.clearRect(0,0,canvas.width,canvas.height);}
function loadImage(e){const file=e.target.files[0];const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,512,512);img.src=URL.createObjectURL(file);}
function downloadImage(){const a=document.createElement("a");a.href=canvas.toDataURL();a.download="image.png";a.click();}
</script>

</div>
