<body class="flex flex-col items-center p-6">

<div class="w-full max-w-5xl bg-gray-900 p-6 rounded-xl shadow-xl">

<h1 class="text-3xl font-bold text-center mb-6">🚀 Right X - AI Studio</h1>

<!-- Tabs -->
<div class="flex justify-center gap-3 mb-6">
    <div class="tab-btn active" onclick="showTab(&#39;images&#39;)">Images</div>
    <div class="tab-btn" onclick="showTab(&#39;videos&#39;)">Videos</div>
    <div class="tab-btn" onclick="showTab(&#39;qa&#39;)">Q&amp;A</div>
</div>

<!-- Images Tab -->
<div id="images" class="tab-content active">
    <textarea id="imagePrompt" rows="3" placeholder="Describe your image..."></textarea>
    <div class="flex gap-2 my-2">
        <select id="imageSize" class="p-2 rounded bg-gray-800">
            <option value="256">256x256</option>
            <option value="512" selected="">512x512</option>
            <option value="1024">1024x1024</option>
        </select>
        <select id="imageType" class="p-2 rounded bg-gray-800">
            <option value="normal">Nano Banana</option>
            <option value="pro">Nano Banana Pro (4 images/day)</option>
        </select>
        <button onclick="generateImage()" class="bg-blue-600 px-4 py-2 text-white">Generate Image</button>
    </div>
    <canvas id="imageCanvas" width="512" height="512"></canvas>
    <div class="flex gap-2 mt-2">
        <button onclick="clearImageCanvas()" class="bg-gray-600 px-3 py-1">Clear</button>
        <button onclick="downloadImage()" class="bg-green-600 px-3 py-1">Download</button>
    </div>
    <div id="imageResult" class="mt-2 text-center"></div>
</div>

<!-- Videos Tab -->
<div id="videos" class="tab-content">
    <textarea id="videoPrompt" rows="3" placeholder="Describe your video..."></textarea>
    <div class="flex gap-2 my-2">
        <select id="videoDuration" class="p-2 rounded bg-gray-800">
            <option value="1">1s</option>
            <option value="5" selected="">5s</option>
            <option value="30">30s</option>
            <option value="60">1min</option>
            <option value="300">5min</option>
        </select>
        <select id="videoType" class="p-2 rounded bg-gray-800">
            <option value="normal">Nano Banana</option>
            <option value="pro">Nano Banana Pro (5 videos/day)</option>
        </select>
        <button onclick="generateVideo()" class="bg-purple-600 px-4 py-2 text-white">Generate Video</button>
    </div>
    <canvas id="videoCanvas" width="512" height="512"></canvas>
    <div id="videoResult" class="mt-2 text-center"></div>
</div>

<!-- Q&A Tab -->
<div id="qa" class="tab-content">
    <textarea id="qaPrompt" rows="3" placeholder="Ask a complex question..."></textarea>
    <button onclick="askQuestion()" class="bg-yellow-600 px-4 py-2 my-2 w-full">Get Answer</button>
    <div id="qaResult" class="mt-2 p-2 bg-gray-700 rounded"></div>
</div>

</div>

<script>
// Tabs system
function showTab(tab){
    document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
    document.getElementById(tab).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    event.currentTarget.classList.add('active');
}

// Simple login (first use)
let currentUser = null;
function requireLogin(callback){
    if(!currentUser){
        let u = prompt("Enter username:");
        let p = prompt("Enter password:");
        if(!u || !p){ alert("Login required!"); return; }
        currentUser = u; // In real system: verify credentials
        callback();
    } else callback();
}

// Image Canvas
const imageCanvas = document.getElementById("imageCanvas");
const imageCtx = imageCanvas.getContext("2d");
function clearImageCanvas(){ imageCtx.clearRect(0,0,imageCanvas.width,imageCanvas.height); }
function downloadImage(){
    const link=document.createElement('a');
    link.download="image.png";
    link.href=imageCanvas.toDataURL();
    link.click();
}
let imageCount=0;
function generateImage(){
    requireLogin(()=>{
        if(imageCount>=4){ alert("Daily limit reached"); return;}
        const prompt=document.getElementById("imagePrompt").value;
        if(!prompt) return alert("Enter prompt");
        imageCount++;
        imageCtx.fillStyle="#374151";
        imageCtx.fillRect(0,0,imageCanvas.width,imageCanvas.height);
        imageCtx.fillStyle="#fff";
        imageCtx.font="20px Poppins";
        imageCtx.fillText("Generated Image",50,50);
        document.getElementById("imageResult").innerText="✅ Image generated!";
    });
}

// Video Canvas
const videoCanvas=document.getElementById("videoCanvas");
const videoCtx=videoCanvas.getContext("2d");
let videoCount=0;
function generateVideo(){
    requireLogin(()=>{
        if(videoCount>=5){ alert("Daily video limit reached"); return;}
        const prompt=document.getElementById("videoPrompt").value;
        if(!prompt) return alert("Enter prompt");
        videoCount++;
        videoCtx.fillStyle="#1e293b";
        videoCtx.fillRect(0,0,videoCanvas.width,videoCanvas.height);
        videoCtx.fillStyle="#f1f5f9";
        videoCtx.font="20px Poppins";
        videoCtx.fillText("Generated Video Frame",50,50);
        document.getElementById("videoResult").innerText="✅ Video generated!";
    });
}

// Q&A
function askQuestion(){
    requireLogin(()=>{
        const q=document.getElementById("qaPrompt").value;
        if(!q) return alert("Enter question");
        document.getElementById("qaResult").innerText="Processing...";
        setTimeout(()=>{
            document.getElementById("qaResult").innerText="💡 Answer: This is a placeholder AI answer to: " + q;
        },1000);
    });
}
</script>

</body></html>
